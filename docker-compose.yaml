services:
  ethereum:
    build:
      context: .
      dockerfile: ethereum/Dockerfile
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  bootstrap:
    build:
      context: .
      dockerfile: ethereum/Dockerfile
    depends_on:
      ethereum:
        condition: service_healthy
    environment:
      ETHEREUM_PROVIDER_URL: http://ethereum:8545
      SFC_RPC_URL: http://ethereum:8545
      SFC_DEMO_DIR: /demo
    volumes:
      - demo-state:/demo
    command: ["npx", "hardhat", "run", "scripts/demo-setup.js", "--network", "localhost"]
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - demo-state:/demo
    command: ["run", "--config", "/demo/local.json", "--audit", "/demo/decisions.jsonl"]
volumes:
  demo-state:
